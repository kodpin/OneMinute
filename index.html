<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneMinute — Премиальные часы</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f5f5f7;
            --bg-secondary: #e8e8ed;
            --dark: #1d1d1f;
            --blue: #0071e3;
            --blue-dark: #0066cc;
            --blue-light: #e8f4fd;
            --gray: #86868b;
            --gray-light: #aeaeb2;
            --white: #ffffff;
            --border: #d2d2d7;
            --border-light: #e5e5ea;
            --red: #ff3b30;
            --green: #34c759;
            --orange: #ff9500;
            --shadow-xs: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --shadow-xl: 0 30px 80px rgba(0,0,0,0.16);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --radius-2xl: 36px;
            --transition-fast: 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-smooth: 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--white); color: var(--dark);
            -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }

        /* ========== АНИМИРОВАННЫЙ ФОН ========== */
        .bg-ambient {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            z-index: -1; pointer-events: none;
            background: 
                radial-gradient(ellipse at 25% 15%, rgba(0,113,227,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 75%, rgba(0,113,227,0.02) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.008) 0%, transparent 70%);
            animation: bgShift 25s ease-in-out infinite;
        }
        @keyframes bgShift {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            33% { transform: translate(1%,-0.5%) rotate(0.3deg); }
            66% { transform: translate(-0.5%,0.8%) rotate(-0.2deg); }
        }

        /* ========== НАВБАР ========== */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            transition: all var(--transition-smooth);
        }
        .navbar.scrolled {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            box-shadow: var(--shadow-xs);
        }
        .nav-container {
            max-width: 1280px; margin: 0 auto; padding: 16px 28px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .logo {
            font-size: 24px; font-weight: 900; letter-spacing: -1px;
            cursor: pointer; user-select: none; transition: transform var(--transition-fast);
            background: linear-gradient(135deg, var(--dark) 0%, #3a3a3c 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo:hover { transform: scale(1.04); }
        .logo span {
            background: linear-gradient(135deg, var(--blue) 0%, #40a9ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .burger-menu {
            display: none; flex-direction: column; gap: 5px;
            background: none; border: none; cursor: pointer;
            padding: 10px; z-index: 1001; border-radius: 50%;
            transition: background var(--transition-fast);
        }
        .burger-menu:hover { background: rgba(0,0,0,0.04); }
        .burger-menu span {
            display: block; width: 22px; height: 2px;
            background: var(--dark); border-radius: 2px;
            transition: all var(--transition-smooth); transform-origin: center;
        }
        .burger-menu.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
        .burger-menu.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .burger-menu.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }
        .nav-links { display: flex; align-items: center; gap: 22px; list-style: none; }
        .nav-links a {
            text-decoration: none; color: var(--dark); font-size: 14px;
            font-weight: 500; transition: color var(--transition-fast);
            position: relative; padding: 4px 0;
        }
        .nav-links a::after {
            content: ''; position: absolute; bottom: -2px; left: 0;
            width: 0; height: 1.5px; background: var(--blue);
            border-radius: 1px; transition: width var(--transition-fast);
        }
        .nav-links a:hover { color: var(--blue); }
        .nav-links a:hover::after { width: 100%; }
        .cart-btn {
            background: var(--bg); border: 1px solid rgba(0,0,0,0.04);
            border-radius: 30px; cursor: pointer; position: relative;
            color: var(--dark); padding: 9px 18px;
            display: flex; align-items: center; gap: 8px;
            transition: all var(--transition-smooth);
            box-shadow: var(--shadow-xs); font-weight: 600; font-size: 13px;
        }
        .cart-btn:hover {
            background: var(--blue-light); border-color: rgba(0,113,227,0.15);
            transform: translateY(-1px); box-shadow: var(--shadow-sm);
        }
        .cart-btn i { font-size: 16px; }
        .cart-count {
            background: var(--blue); color: white; border-radius: 50%;
            min-width: 21px; height: 21px; font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: transform var(--transition-bounce);
        }
        .cart-count.bump { transform: scale(1.5); }
        .manager-btn-header {
            background: var(--green); color: white; border: none;
            border-radius: 30px; padding: 9px 18px; font-size: 13px;
            font-weight: 600; cursor: pointer; transition: all var(--transition-smooth);
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 8px rgba(52,199,89,0.2);
        }
        .manager-btn-header:hover { background: #30b350; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(52,199,89,0.3); }
        .manager-btn-header i { font-size: 14px; }

        @media (max-width: 768px) {
            .burger-menu { display: flex; }
            .nav-links {
                position: fixed; top: 0; right: -100%;
                width: 78%; max-width: 340px; height: 100vh;
                background: rgba(255,255,255,0.96);
                backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
                flex-direction: column; padding: 110px 32px 40px;
                gap: 28px; transition: right 0.5s cubic-bezier(0.25,0.1,0.25,1);
                box-shadow: -10px 0 60px rgba(0,0,0,0.08);
            }
            .nav-links.active { right: 0; }
            .nav-links a { font-size: 17px; }
            .manager-btn-header span { display: none; }
            .manager-btn-header { padding: 10px 14px; }
        }

        /* ========== ПОИСК И ФИЛЬТРЫ ========== */
        .search-filter-bar {
            max-width: 1280px; margin: 0 auto 32px; padding: 0 28px;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .search-wrap {
            flex: 1; min-width: 240px; position: relative;
        }
        .search-wrap i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--gray); font-size: 16px; pointer-events: none;
        }
        .search-input {
            width: 100%; padding: 14px 18px 14px 44px;
            border: 1.5px solid var(--border-light); border-radius: var(--radius-md);
            font-size: 15px; font-family: inherit; background: var(--white);
            transition: all var(--transition-fast); color: var(--dark);
        }
        .search-input:focus {
            outline: none; border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(0,113,227,0.06);
        }
        .search-input::placeholder { color: var(--gray-light); }
        .search-clear {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--gray); cursor: pointer;
            font-size: 16px; padding: 4px; display: none;
        }
        .search-clear.visible { display: block; }

        .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-chip {
            padding: 10px 18px; border-radius: 30px; font-size: 13px;
            font-weight: 600; cursor: pointer; border: 1.5px solid var(--border-light);
            background: var(--white); color: var(--gray); transition: all var(--transition-fast);
            white-space: nowrap; user-select: none;
        }
        .filter-chip:hover { border-color: var(--gray-light); color: var(--dark); }
        .filter-chip.active {
            background: var(--dark); color: white; border-color: var(--dark);
            box-shadow: var(--shadow-sm);
        }
        .filter-chip i { margin-right: 6px; font-size: 12px; }
        .results-count {
            font-size: 13px; color: var(--gray); font-weight: 500;
            white-space: nowrap; margin-left: auto;
        }

        /* ========== КАТАЛОГ ========== */
        .catalog { padding: 110px 28px 80px; max-width: 1280px; margin: 0 auto; }
        .section-title {
            font-size: 44px; font-weight: 900; letter-spacing: -1.5px;
            text-align: center; margin-bottom: 8px;
            background: linear-gradient(135deg, var(--dark) 0%, #444 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-subtitle {
            text-align: center; color: var(--gray); font-size: 15px;
            margin-bottom: 40px; font-weight: 400;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
        }
        .no-results {
            grid-column: 1/-1; text-align: center; padding: 60px 0; color: var(--gray);
        }
        .no-results i { font-size: 40px; margin-bottom: 16px; display: block; color: var(--gray-light); }

        .product-card {
            background: var(--white); border-radius: var(--radius-lg);
            overflow: hidden; cursor: pointer; position: relative;
            box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.03);
            transition: all var(--transition-smooth);
            animation: cardIn 0.5s ease forwards; opacity: 0; transform: translateY(24px);
        }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
        .product-card:hover {
            transform: translateY(-6px); box-shadow: var(--shadow-lg);
            border-color: rgba(0,0,0,0.06);
        }
        .product-card:active { transform: scale(0.97); transition: transform 0.12s ease; }
        .product-image-wrap {
            position: relative; overflow: hidden; height: 250px;
            background: linear-gradient(135deg, #f0f0f5 0%, #e6e6ed 100%);
        }
        .product-image {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.25,0.1,0.25,1);
        }
        .product-card:hover .product-image { transform: scale(1.06); }
        .product-badge {
            position: absolute; top: 14px; left: 14px;
            background: rgba(255,255,255,0.88); backdrop-filter: blur(12px);
            padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .product-badge.luxury { color: #b8860b; }
        .product-badge.smart { color: var(--blue); }
        .product-info { padding: 20px; }
        .product-name { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px; }
        .product-description {
            color: var(--gray); font-size: 13px; line-height: 1.6; margin-bottom: 14px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .product-price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .product-price { font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
        .product-buttons { display: flex; gap: 8px; }
        .buy-btn, .cart-btn-sm {
            border: none; border-radius: var(--radius-sm); font-size: 13px;
            font-weight: 600; cursor: pointer; transition: all var(--transition-fast);
            padding: 11px 0; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .buy-btn {
            background: var(--blue); color: white; flex: 1.2;
            box-shadow: 0 4px 12px rgba(0,113,227,0.2);
        }
        .buy-btn:hover { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,113,227,0.3); }
        .buy-btn:active { transform: scale(0.95); }
        .cart-btn-sm {
            background: var(--bg); color: var(--dark); flex: 1;
            border: 1px solid transparent;
        }
        .cart-btn-sm:hover { background: #e0e0e5; border-color: var(--border); }
        .cart-btn-sm i, .buy-btn i { font-size: 12px; }

        /* ========== КАРТОЧКА ТОВАРА (МОДАЛКА) ========== */
        .product-modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 3000;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px); animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .product-modal-content {
            background: var(--white); border-radius: var(--radius-2xl);
            max-width: 520px; width: 94%; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            max-height: 92vh; overflow-y: auto;
            box-shadow: var(--shadow-xl); animation: modalIn 0.45s cubic-bezier(0.25,0.1,0.25,1);
        }
        @keyframes modalIn { from { transform: translate(-50%,-42%); opacity: 0; } to { transform: translate(-50%,-50%); opacity: 1; } }
        .product-modal-image-wrap {
            position: relative; height: 300px; overflow: hidden;
            border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
            background: linear-gradient(135deg, #f0f0f5, #e2e2ea);
        }
        .product-modal-image { width: 100%; height: 100%; object-fit: cover; }
        .product-modal-body { padding: 26px; }
        .product-modal-category {
            display: inline-flex; align-items: center; gap: 7px;
            background: var(--bg); padding: 7px 15px; border-radius: 22px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--gray); margin-bottom: 14px;
        }
        .product-modal-category::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
        }
        .product-modal-name { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 6px; }
        .product-modal-price { font-size: 30px; font-weight: 800; color: var(--blue); margin-bottom: 18px; }
        .product-modal-description { font-size: 15px; line-height: 1.75; color: var(--gray); margin-bottom: 24px; }
        .product-modal-features {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px;
        }
        .feature-item {
            background: var(--bg); padding: 14px 12px; border-radius: var(--radius-sm);
            text-align: center; transition: transform var(--transition-fast);
        }
        .feature-item:hover { transform: translateY(-2px); background: #eeeef2; }
        .feature-item i { font-size: 18px; margin-bottom: 6px; color: var(--blue); display: block; }
        .feature-label { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 3px; }
        .feature-value { font-size: 13px; font-weight: 700; }
        .product-modal-buttons { display: flex; gap: 10px; }
        .product-modal-buy, .product-modal-cart {
            border: none; padding: 15px 0; border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all var(--transition-fast); flex: 1;
        }
        .product-modal-buy { background: var(--blue); color: white; box-shadow: 0 4px 14px rgba(0,113,227,0.25); }
        .product-modal-buy:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,113,227,0.35); }
        .product-modal-cart { background: var(--bg); color: var(--dark); }
        .product-modal-cart:hover { background: #e0e0e5; }
        .product-modal-close {
            position: absolute; top: 14px; right: 14px; width: 36px; height: 36px;
            border-radius: 50%; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px); border: none; font-size: 18px;
            cursor: pointer; color: var(--dark); display: flex;
            align-items: center; justify-content: center; transition: all var(--transition-fast);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1;
        }
        .product-modal-close:hover { background: white; transform: scale(1.08); }

        /* ========== МОДАЛЬНЫЕ ОКНА ========== */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 2000;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); animation: fadeIn 0.3s ease;
        }
        .modal-content {
            background: var(--white); border-radius: var(--radius-xl);
            padding: 30px 26px; max-width: 460px; width: 94%;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); max-height: 88vh; overflow-y: auto;
            box-shadow: var(--shadow-xl); animation: modalIn 0.4s cubic-bezier(0.25,0.1,0.25,1);
        }
        .modal-close {
            position: absolute; right: 16px; top: 16px; width: 34px; height: 34px;
            border-radius: 50%; background: var(--bg); border: none; font-size: 18px;
            cursor: pointer; color: var(--gray); display: flex;
            align-items: center; justify-content: center; transition: all var(--transition-fast);
        }
        .modal-close:hover { background: #e0e0e5; color: var(--dark); }
        .modal h2 { font-size: 23px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 22px; }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 13px 0; border-bottom: 1px solid rgba(0,0,0,0.04);
            animation: itemIn 0.3s ease;
        }
        @keyframes itemIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
        .cart-item-name { font-weight: 600; font-size: 14px; }
        .cart-item-price { color: var(--gray); font-size: 12px; margin-top: 2px; }
        .cart-item-remove {
            background: none; border: none; color: var(--red); cursor: pointer;
            font-size: 12px; font-weight: 600; padding: 6px 12px;
            border-radius: 18px; transition: background var(--transition-fast);
        }
        .cart-item-remove:hover { background: rgba(255,59,48,0.07); }
        .cart-empty { text-align: center; color: var(--gray); padding: 40px 0; font-size: 15px; }
        .cart-empty i { font-size: 44px; margin-bottom: 14px; display: block; color: var(--gray-light); }
        .cart-total {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0; font-size: 19px; font-weight: 800;
            border-top: 2px solid var(--dark); margin-top: 10px; letter-spacing: -0.3px;
        }
        .checkout-btn, .submit-btn {
            background: var(--blue); color: white; border: none;
            padding: 15px 0; border-radius: var(--radius-sm); font-size: 16px;
            font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px;
            box-shadow: 0 4px 14px rgba(0,113,227,0.22);
            transition: all var(--transition-fast);
        }
        .checkout-btn:hover, .submit-btn:hover {
            background: var(--blue-dark); transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0,113,227,0.32);
        }
        #orderForm { display: flex; flex-direction: column; gap: 13px; margin-top: 4px; }
        #orderForm input, #orderForm textarea {
            padding: 13px 16px; border: 1.5px solid var(--border-light);
            border-radius: var(--radius-sm); font-size: 15px; font-family: inherit;
            width: 100%; transition: all var(--transition-fast); background: var(--bg);
        }
        #orderForm input:focus, #orderForm textarea:focus {
            outline: none; border-color: var(--blue); background: white;
            box-shadow: 0 0 0 4px rgba(0,113,227,0.06);
        }
        #orderForm textarea { resize: vertical; min-height: 80px; }
        .order-summary { background: var(--bg); padding: 13px 16px; border-radius: var(--radius-sm); font-weight: 600; }

        .payment-options { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
        .payment-btn {
            background: var(--bg); color: var(--dark); border: 1px solid transparent;
            padding: 15px 18px; border-radius: var(--radius-sm); font-size: 14px;
            font-weight: 600; cursor: pointer; text-align: left;
            transition: all var(--transition-fast); display: flex; align-items: center; gap: 12px;
        }
        .payment-btn:hover { background: white; border-color: var(--blue); box-shadow: var(--shadow-md); }
        .payment-btn i { font-size: 20px; color: var(--blue); width: 24px; text-align: center; }
        .qr-container { text-align: center; margin-top: 18px; display: none; animation: fadeIn 0.4s ease; }
        .qr-container img { max-width: 190px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); border: 1px solid var(--border-light); }

        /* ========== КНОПКА МЕНЕДЖЕРА (фиксированная) ========== */
        .manager-fab {
            position: fixed; bottom: 28px; right: 28px; z-index: 1500;
            background: var(--green); color: white; border: none;
            width: 56px; height: 56px; border-radius: 50%;
            font-size: 22px; cursor: pointer;
            box-shadow: 0 6px 24px rgba(52,199,89,0.35);
            transition: all var(--transition-smooth);
            display: flex; align-items: center; justify-content: center;
        }
        .manager-fab:hover {
            transform: scale(1.1); box-shadow: 0 10px 35px rgba(52,199,89,0.45);
        }
        .manager-fab:active { transform: scale(0.9); }
        @media (min-width: 769px) {
            .manager-fab { display: none; }
        }

        /* ========== ФУТЕР ========== */
        .footer {
            background: var(--bg); padding: 48px 28px 28px; margin-top: 30px;
            border-top: 1px solid rgba(0,0,0,0.03);
        }
        .footer-content {
            max-width: 1280px; margin: 0 auto;
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 28px;
        }
        .footer-info { white-space: pre-line; line-height: 1.9; color: var(--gray); font-size: 13px; }
        .footer-links { display: flex; flex-direction: column; gap: 10px; }
        .footer-links a {
            color: var(--dark); text-decoration: none; font-size: 13px;
            font-weight: 500; transition: color var(--transition-fast);
        }
        .footer-links a:hover { color: var(--blue); }

        .overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.35);
            z-index: 999; backdrop-filter: blur(3px);
        }
        .overlay.active { display: block; }

        .notification {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--dark); color: white; padding: 13px 26px;
            border-radius: 30px; font-size: 14px; font-weight: 600;
            z-index: 4000; box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            animation: notifIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes notifIn {
            from { bottom: -60px; opacity: 0; transform: translateX(-50%) scale(0.85); }
            to { bottom: 100px; opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* Частицы */
        .particles-container { position: fixed; top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5000; }
        .particle {
            position: absolute; width: 6px; height: 6px;
            background: var(--blue); border-radius: 50%;
            animation: particleFly 0.7s ease-out forwards;
        }
        @keyframes particleFly {
            0% { opacity:1; transform:translate(0,0) scale(1); }
            100% { opacity:0; transform:translate(var(--dx),var(--dy)) scale(0); }
        }
    </style>
</head>
<body>

    <div class="bg-ambient"></div>
    <div class="overlay" id="overlay"></div>
    <div class="particles-container" id="particles"></div>

    <!-- НАВБАР -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <button class="burger-menu" id="burgerBtn" aria-label="Меню"><span></span><span></span><span></span></button>
                <div class="logo" onclick="location.reload()">One<span>Minute</span></div>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="#catalog">Каталог</a>
                <a href="#footer">Контакты</a>
                <a href="#" id="managerLink">Поддержка</a>
                <button class="manager-btn-header" onclick="orderByManager()">
                    <i class="fa-solid fa-headset"></i> <span>Менеджер</span>
                </button>
                <button class="cart-btn" onclick="openCart()" aria-label="Корзина">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Корзина</span>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- КАТАЛОГ -->
    <main class="catalog" id="catalog">
        <h2 class="section-title">Каталог часов</h2>
        <p class="section-subtitle">Найдите идеальные часы для любого случая</p>
        
        <!-- Поиск и фильтры -->
        <div class="search-filter-bar">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию или описанию..." oninput="filterProducts()">
                <button class="search-clear" id="searchClear" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="filter-chips" id="filterChips">
                <button class="filter-chip active" onclick="setFilter('all', this)"><i class="fa-solid fa-grid-2"></i> Все</button>
                <button class="filter-chip" onclick="setFilter('smart', this)"><i class="fa-solid fa-microchip"></i> Smart</button>
                <button class="filter-chip" onclick="setFilter('classic', this)"><i class="fa-solid fa-clock"></i> Classic</button>
                <button class="filter-chip" onclick="setFilter('luxury', this)"><i class="fa-solid fa-gem"></i> Luxury</button>
            </div>
            <span class="results-count" id="resultsCount"></span>
        </div>

        <div class="products-grid" id="productsGrid">
            <p style="text-align:center;color:var(--gray);padding:60px 0;grid-column:1/-1;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size:28px;margin-bottom:14px;display:block;"></i> Загрузка...
            </p>
        </div>
    </main>

    <!-- КАРТОЧКА ТОВАРА -->
    <div class="product-modal" id="productModal">
        <div class="product-modal-content">
            <button class="product-modal-close" onclick="closeProductModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="product-modal-image-wrap">
                <img src="" alt="" class="product-modal-image" id="modalImage">
            </div>
            <div class="product-modal-body">
                <span class="product-modal-category" id="modalCategory"></span>
                <h2 class="product-modal-name" id="modalName"></h2>
                <div class="product-modal-price" id="modalPrice"></div>
                <p class="product-modal-description" id="modalDescription"></p>
                <div class="product-modal-features">
                    <div class="feature-item"><i class="fa-solid fa-truck-fast"></i><div class="feature-label">Доставка</div><div class="feature-value">По всей РФ</div></div>
                    <div class="feature-item"><i class="fa-solid fa-shield-halved"></i><div class="feature-label">Гарантия</div><div class="feature-value">2 года</div></div>
                    <div class="feature-item"><i class="fa-solid fa-credit-card"></i><div class="feature-label">Оплата</div><div class="feature-value">QR / Ссылка</div></div>
                    <div class="feature-item"><i class="fa-solid fa-rotate-left"></i><div class="feature-label">Возврат</div><div class="feature-value">14 дней</div></div>
                </div>
                <div class="product-modal-buttons">
                    <button class="product-modal-buy" id="modalBuyBtn"><i class="fa-solid fa-bolt"></i> Купить сейчас</button>
                    <button class="product-modal-cart" id="modalCartBtn"><i class="fa-solid fa-cart-plus"></i> В корзину</button>
                </div>
            </div>
        </div>
    </div>

    <!-- КОРЗИНА -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeCart()"><i class="fa-solid fa-xmark"></i></button>
            <h2><i class="fa-solid fa-bag-shopping" style="margin-right:10px;"></i>Корзина</h2>
            <div id="cartItems"></div>
            <div class="cart-total"><span>Итого</span><span id="cartTotal">0 ₽</span></div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <!-- ОФОРМЛЕНИЕ -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeOrder()"><i class="fa-solid fa-xmark"></i></button>
            <h2><i class="fa-solid fa-clipboard-list" style="margin-right:10px;"></i>Оформление заказа</h2>
            <form id="orderForm">
                <input type="text" placeholder="Ваше имя" required>
                <input type="tel" placeholder="Номер телефона" required>
                <input type="email" placeholder="Email (необязательно)">
                <textarea placeholder="Адрес доставки" required></textarea>
                <div class="order-summary" id="orderSummary"></div>
                <button type="submit" class="submit-btn">Перейти к оплате</button>
            </form>
        </div>
    </div>

    <!-- ОПЛАТА -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closePayment()"><i class="fa-solid fa-xmark"></i></button>
            <h2><i class="fa-solid fa-wallet" style="margin-right:10px;"></i>Способ оплаты</h2>
            <div class="payment-options">
                <button class="payment-btn" onclick="showQR()"><i class="fa-solid fa-qrcode"></i> Оплатить по QR-коду</button>
                <button class="payment-btn" onclick="payByLink()"><i class="fa-solid fa-link"></i> Оплатить с телефона</button>
                <button class="payment-btn" onclick="orderByManager()"><i class="fa-solid fa-headset"></i> Заказать через менеджера</button>
            </div>
            <div class="qr-container" id="qrContainer">
                <p style="margin-bottom:14px;font-weight:600;">Отсканируйте QR-код:</p>
                <img id="qrImage" src="" alt="QR-код оплаты">
            </div>
        </div>
    </div>

    <!-- КНОПКА МЕНЕДЖЕРА (мобильная) -->
    <button class="manager-fab" onclick="orderByManager()" title="Связаться с менеджером">
        <i class="fa-solid fa-headset"></i>
    </button>

    <!-- ФУТЕР -->
    <footer class="footer" id="footer">
        <div class="footer-content">
            <div class="footer-info" id="ipInfo">Загрузка...</div>
            <div class="footer-links">
                <a href="#catalog">Каталог</a>
                <a href="#" id="supportLink">Поддержка</a>
            </div>
        </div>
    </footer>

    <script>
        let PRODUCTS = [], SETTINGS = {}, cart = [], currentProductId = null;
        let currentFilter = 'all';

        // ==================== ЗАГРУЗКА ====================
        async function loadData() {
            try {
                const r = await fetch('data/products.json');
                if (!r.ok) throw new Error('no data');
                const d = await r.json();
                PRODUCTS = d.products || [];
                SETTINGS = d.settings || {};
                filterProducts();
                updateFooter();
                updateLinks();
            } catch(e) {
                document.getElementById('productsGrid').innerHTML = '<p style="text-align:center;color:var(--gray);padding:60px 0;grid-column:1/-1;"><i class="fa-solid fa-triangle-exclamation" style="font-size:32px;margin-bottom:12px;display:block;"></i>Ошибка загрузки</p>';
            }
        }

        function updateLinks() {
            const l = SETTINGS.manager_telegram || 'https://t.me/manager';
            document.querySelectorAll('#managerLink, #supportLink').forEach(e => e.href = l);
        }

        // ==================== ПОИСК И ФИЛЬТРЫ ====================
        function setFilter(cat, el) {
            currentFilter = cat;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            if (el) el.classList.add('active');
            filterProducts();
        }

        function filterProducts() {
            const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const clearBtn = document.getElementById('searchClear');
            clearBtn.classList.toggle('visible', query.length > 0);

            let filtered = PRODUCTS;
            if (currentFilter !== 'all') filtered = filtered.filter(p => p.category === currentFilter);
            if (query) filtered = filtered.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.description.toLowerCase().includes(query) ||
                catName(p.category).toLowerCase().includes(query)
            );

            document.getElementById('resultsCount').textContent = `${filtered.length} из ${PRODUCTS.length}`;
            renderProducts(filtered);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterProducts();
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            if (!products.length) {
                grid.innerHTML = `<div class="no-results"><i class="fa-solid fa-magnifying-glass"></i>Ничего не найдено<br><span style="font-size:13px;">Попробуйте изменить запрос или фильтр</span></div>`;
                return;
            }
            grid.innerHTML = products.map((p, i) => `
                <div class="product-card" style="animation-delay:${i*0.06}s" onclick="openProductModal(${p.id})">
                    <div class="product-image-wrap">
                        <img src="${p.image}" alt="${p.name}" class="product-image" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/f5f5f7/86868b?text=${encodeURIComponent(p.name)}'">
                        <span class="product-badge ${p.category}">${catName(p.category)}</span>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${p.name}</h3>
                        <p class="product-description">${p.description}</p>
                        <div class="product-price-row"><span class="product-price">${fmt(p.price)}</span></div>
                        <div class="product-buttons">
                            <button class="buy-btn" onclick="event.stopPropagation(); buyNow(${p.id})"><i class="fa-solid fa-bolt"></i> Купить</button>
                            <button class="cart-btn-sm" onclick="event.stopPropagation(); addToCart(${p.id}, this)"><i class="fa-solid fa-cart-plus"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function fmt(p) { return p.toLocaleString('ru-RU') + ' ₽'; }
        function catName(c) { return {'smart':'Smart','classic':'Classic','luxury':'Luxury'}[c] || c; }

        // Navbar scroll
        window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20));

        // ==================== КАРТОЧКА ====================
        function openProductModal(id) {
            const p = PRODUCTS.find(x => x.id === id); if (!p) return;
            currentProductId = id;
            document.getElementById('modalImage').src = p.image;
            document.getElementById('modalCategory').textContent = catName(p.category);
            document.getElementById('modalName').textContent = p.name;
            document.getElementById('modalPrice').textContent = fmt(p.price);
            document.getElementById('modalDescription').textContent = p.description;
            document.getElementById('modalBuyBtn').onclick = () => { closeProductModal(); buyNow(id); };
            document.getElementById('modalCartBtn').onclick = () => { closeProductModal(); addToCart(id); };
            document.getElementById('productModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        function closeProductModal() { document.getElementById('productModal').style.display='none'; document.body.style.overflow=''; }

        function buyNow(id) {
            const p = PRODUCTS.find(x => x.id === id); if (!p) return;
            document.getElementById('orderSummary').innerHTML = `Товар: <strong>${p.name}</strong><br>Сумма: <strong>${fmt(p.price)}</strong>`;
            document.getElementById('orderModal').style.display='block'; document.body.style.overflow='hidden';
        }

        // ==================== КОРЗИНА ====================
        function addToCart(id, btn) {
            const p = PRODUCTS.find(x => x.id === id); if (!p) return;
            const ex = cart.find(x => x.product.id === id);
            ex ? ex.quantity++ : cart.push({product:p, quantity:1});
            updateCartCount(); showNotification(p.name + ' добавлен');
            if (btn) spawnParticles(btn);
        }
        function removeFromCart(i) { cart.splice(i,1); updateCartCount(); renderCart(); }
        function updateCartCount() {
            const el = document.getElementById('cartCount');
            const cnt = cart.reduce((s,i)=>s+i.quantity,0);
            el.textContent = cnt;
            el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),300);
        }
        function renderCart() {
            const c = document.getElementById('cartItems'), t = document.getElementById('cartTotal');
            if (!cart.length) { c.innerHTML = '<div class="cart-empty"><i class="fa-solid fa-bag-shopping"></i>Корзина пуста</div>'; t.textContent='0 ₽'; return; }
            let total = 0;
            c.innerHTML = cart.map((item,i) => {
                const st = item.product.price*item.quantity; total+=st;
                return `<div class="cart-item"><div><div class="cart-item-name">${item.product.name}</div><div class="cart-item-price">${item.quantity} × ${fmt(item.product.price)}</div></div><div style="display:flex;align-items:center;gap:12px;"><span style="font-weight:700;">${fmt(st)}</span><button class="cart-item-remove" onclick="removeFromCart(${i})"><i class="fa-solid fa-trash-can"></i></button></div></div>`;
            }).join('');
            t.textContent = fmt(total);
        }
        function openCart() { renderCart(); document.getElementById('cartModal').style.display='block'; document.body.style.overflow='hidden'; }
        function closeCart() { document.getElementById('cartModal').style.display='none'; document.body.style.overflow=''; }
        function checkout() {
            if(!cart.length){showNotification('Корзина пуста');return;}
            closeCart();
            document.getElementById('orderSummary').innerHTML = `Сумма заказа: <strong>${fmt(cart.reduce((s,i)=>s+i.product.price*i.quantity,0))}</strong>`;
            document.getElementById('orderModal').style.display='block'; document.body.style.overflow='hidden';
        }
        function closeOrder() { document.getElementById('orderModal').style.display='none'; document.body.style.overflow=''; }
        document.getElementById('orderForm').addEventListener('submit',function(e){e.preventDefault();closeOrder();document.getElementById('paymentModal').style.display='block';});
        function closePayment() { document.getElementById('paymentModal').style.display='none'; document.getElementById('qrContainer').style.display='none'; document.body.style.overflow=''; }
        function showQR() { document.getElementById('qrImage').src = SETTINGS.payment_qr||''; document.getElementById('qrContainer').style.display='block'; }
        function payByLink() { if(SETTINGS.payment_link) window.open(SETTINGS.payment_link,'_blank'); }
        function orderByManager() { window.open(SETTINGS.manager_telegram||'https://t.me/manager','_blank'); }
        function updateFooter() { document.getElementById('ipInfo').textContent = SETTINGS.ip_info||'Информация не указана'; }

        // Частицы
        function spawnParticles(el) {
            const rect = el.getBoundingClientRect();
            const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
            const container=document.getElementById('particles');
            for(let i=0;i<8;i++){
                const p=document.createElement('div'); p.className='particle';
                const angle=Math.random()*Math.PI*2, dist=30+Math.random()*50;
                p.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px`;
                container.appendChild(p); setTimeout(()=>p.remove(),700);
            }
        }

        // Бургер
        const burgerBtn=document.getElementById('burgerBtn'),navLinks=document.getElementById('navLinks'),overlay=document.getElementById('overlay');
        burgerBtn.addEventListener('click',()=>{burgerBtn.classList.toggle('active');navLinks.classList.toggle('active');overlay.classList.toggle('active');document.body.style.overflow=navLinks.classList.contains('active')?'hidden':'';});
        overlay.addEventListener('click',()=>{burgerBtn.classList.remove('active');navLinks.classList.remove('active');overlay.classList.remove('active');document.body.style.overflow='';});

        // Закрытие модалок
        document.querySelectorAll('.modal,.product-modal').forEach(m=>{m.addEventListener('click',function(e){if(e.target===this){this.style.display='none';document.body.style.overflow='';if(this.id==='paymentModal')document.getElementById('qrContainer').style.display='none';}});});

        function showNotification(msg){
            const old=document.querySelector('.notification'); if(old)old.remove();
            const n=document.createElement('div'); n.className='notification'; n.textContent=msg;
            document.body.appendChild(n); setTimeout(()=>{n.style.opacity='0';n.style.transition='opacity 0.3s';setTimeout(()=>n.remove(),300);},2200);
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
